<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/catalog.css">
    <title>MIRA | CATALOGO </title>
</head>

<body>
    <div id="sabia-widget-container"></div>
    <div id="navbar-container"></div>

    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Flanantes</h1>
            <p class="hero-desc">Um vídeo que retrata o skate de rua como forma de flanar pela cidade, transformando espaços urbanos em experiências livres, criativas e cheias de significado.</p>
            <button class="hero-btn">ASSISTIR</button>
        </div>
    </section>

    <nav class="secondary-nav">
        <ul class="secondary-nav-links">
            <li><a href="../pages/filmes.html">Filmes</a></li>
            <li><a href="../pages/series.html">Séries</a></li>
            <li><a href="../pages/documentarios.html">Documentários</a></li>
            <li><a href="../pages/curtas.html">Curtas-Metragens</a></li>
        </ul>
    </nav>

    <div class="main-container">

        <section class="ranking-section" id="ranking-container">
            </section>

        <h2 class="section-title">O Melhor do Cinema Brasileiro</h2>

        <div class="mosaic-grid" id="mosaic-container">
            </div>

        <section class="collection-section">
            <div class="collection-text">
                <h2 class="collection-title">AÇÃO DE ROER<br>AS UNHAS</h2>
                <p class="collection-desc"></p>
            </div>

            <div class="card-stack-container" id="card-stack" title="Clique para ver o próximo">
                </div>

            <div class="collection-link">
                <a href="#">VER MAIS</a>
            </div>
        </section>

    </div>

    <div id="footer-container"></div>

    <script src="../js/template.js"></script>

    <script>

        // 1. Dados do Ranking
        const rankingData = [
            {
                number: 1,
                title: "O Último Craque",
                desc: "Ele carrega o sonho de uma comunidade inteira nas chuteiras, mas o campo está minado.",
                img: "../img_catalogo/ImgMira/O ultimo craque.png"
            },
            {
                number: 2,
                title: "Paixão de São João",
                desc: "Entre quadrilhas rivais no maior arraial do Nordeste, o amor acendeu a fogueira errada.",
                img: "../img_catalogo/ImgMira/Paixao de sao joao.png"
            },
            {
                number: 3,
                title: "O Assobio da Mata",
                desc: "Na Amazônia profunda, algumas lendas têm dentes e pés virados para trás.",
                img: "../img_catalogo/ImgMira/O Assobio da mata.png"
            }
        ];

        // 2. Dados do Mosaico
        const mosaicData = [
            { class: "m-1", type: "image", src: "../img_catalogo/ImgMira/colection.png", alt: "Central do Brasil" },
            { class: "m-2", type: "image", src: "../img_catalogo/ImgMira/colection (7).png", alt: "", style: "object-position: top;" },
            { class: "m-3", type: "image", src: "../img_catalogo/ImgMira/colection (1).png", alt: "" },
            { class: "m-4", type: "image", src: "../img_catalogo/ImgMira/colection (2).png", alt: "" },
            { class: "m-5", type: "image", src: "../img_catalogo/ImgMira/colection (4).png", alt: "" },
            { class: "m-6", type: "image", src: "../img_catalogo/ImgMira/colection (8).png", alt: "" },
            { class: "m-7", type: "text",  title: "CINEMA<br>BRASILEIRO<br>2000", subtitle: "Uma década de ouro para nossa cultura." },
            { class: "m-8", type: "image", src: "../img_catalogo/ImgMira/colection (6).png", alt: "" },
            { class: "m-9", type: "image", src: "../img_catalogo/ImgMira/colection (5).png", alt: "" }
        ];

        // 3. Dados do Stack (Pilha de Cards)
        const stackData = [
            { src: "../img_catalogo/ImgMira/O Assobio da mata.png", alt: "Bacurau" },
            { src: "../img_catalogo/ImgMira/O bado das Marias.png", alt: "Tropa" },
            { src: "../img_catalogo/ImgMira/Bloco C.png", alt: "Cidade Deus" },
            { src: "../img_catalogo/ImgMira/O ultimo craque.png", alt: "Marighella" },
            { src: "../img_catalogo/ImgMira/Os Guardioes do pantanal.png", alt: "Lobo" }
        ];

        // --- FUNÇÕES DE RENDERIZAÇÃO ---

        function renderRanking() {
            const container = document.getElementById('ranking-container');
            let html = '';

            rankingData.forEach(item => {
                html += `
                <div class="ranking-card" style="display: flex; align-items: center; justify-content: space-between;">
                    <div class="ranking-number">${item.number}</div>
                    
                    <div style="flex: 1; padding: 0 15px; color: white; text-align: left;">
                        <h3 style="margin: 0; font-size: 1.2rem;">${item.title}</h3>
                        <p style="margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.8;">
                            ${item.desc}
                        </p>
                    </div>
                    <div class="ranking-img-box"><img src="${item.img}" alt="${item.title}"></div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function renderMosaic() {
            const container = document.getElementById('mosaic-container');
            let html = '';

            mosaicData.forEach(item => {
                html += `<div class="mosaic-item ${item.class}">`;
                
                if (item.type === 'image') {
                    const styleAttr = item.style ? `style="${item.style}"` : '';
                    html += `<img src="${item.src}" alt="${item.alt}" ${styleAttr}>`;
                } else if (item.type === 'text') {
                    html += `
                    <div class="m-text-block">
                        <h3 style="font-size: 2.5rem; text-transform: uppercase; line-height: 1;">
                            ${item.title}
                        </h3>
                        <p style="margin-top: 15px; font-size: 1rem; color: rgba(255,255,255,0.8);">
                            ${item.subtitle}
                        </p>
                    </div>`;
                }
                
                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function renderStack() {
            const container = document.getElementById('card-stack');
            let html = '';

            stackData.forEach(item => {
                html += `
                <div class="stack-card">
                    <img src="${item.src}" alt="${item.alt}">
                </div>`;
            });

            container.innerHTML = html;
        }

        // --- INICIALIZAÇÃO ---

        // Renderiza tudo ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            renderRanking();
            renderMosaic();
            renderStack();

            setupStackRotation();
        });

        function setupStackRotation() {
            const stackContainer = document.getElementById('card-stack');
            
            stackContainer.addEventListener('click', function() {
                const cards = stackContainer.querySelectorAll('.stack-card');
                if (cards.length < 2) return;

                const topCard = cards[0];
                topCard.classList.add('slide-out');

                setTimeout(() => {
                    topCard.classList.remove('slide-out');
                    stackContainer.appendChild(topCard);
                }, 600);
            });
        }
    </script>
</body>

</html>
